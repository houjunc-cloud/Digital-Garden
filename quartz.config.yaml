configuration:
  pageTitle: HJC's Garden
  pageTitleSuffix: " · digital garden"
  enableSPA: true
  enablePopovers: true
  # The obsidian template defaults this to plausible, which loads a tracker from
  # plausible.io on every page. Off unless you actually want it — to enable,
  # replace `null` with `provider: plausible` (and register the domain with
  # Plausible, otherwise it reports nowhere).
  analytics: null
  locale: zh-CN
  baseUrl: digital-garden.houjunc16.workers.dev
  ignorePatterns:
    - private
    - templates
    - .obsidian
    - "**/.obsidian/**"
    - "**/*.excalidraw.md"
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      header: Newsreader
      body: Source Sans Pro
      code: IBM Plex Mono
    colors:
      lightMode:
        light: "#faf8f8"
        lightgray: "#e5e5e5"
        gray: "#b8b8b8"
        darkgray: "#4e4e4e"
        dark: "#2b2b2b"
        secondary: "#3b6b4c"
        tertiary: "#84a59d"
        highlight: rgba(59, 107, 76, 0.10)
        textHighlight: "#fff23688"
      darkMode:
        light: "#1c1f1d"
        lightgray: "#393639"
        gray: "#646464"
        darkgray: "#d4d4d4"
        dark: "#ebebec"
        secondary: "#8fc7a3"
        tertiary: "#84a59d"
        highlight: rgba(143, 199, 163, 0.12)
        textHighlight: "#b3aa0288"
plugins:
  - source: "@quartz-community/created-modified-date"
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      comments: true
      highlight: true
      wikilinks: true
      callouts: true
      mermaid: true
      parseTags: true
      parseArrows: true
      parseBlockReferences: true
      enableInHtmlEmbed: false
      enableYouTubeEmbed: true
      enableVideoEmbed: true
      enableCheckbox: true
    order: 30
  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 40
  - source: "@quartz-community/table-of-contents"
    enabled: true
    order: 50
    layout:
      position: right
      priority: 30
  - source: "@quartz-community/crawl-links"
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: "@quartz-community/description"
    enabled: true
    order: 70
  - source: "@quartz-community/latex"
    enabled: true
    options:
      renderEngine: katex
      # Same names/expansions as Settings → Editor → Math → Edit math macros
      # in Obsidian, so a formula that renders locally renders the same here.
      customMacros:
        "\\inj": "\\hookrightarrow"
        "\\surj": "\\twoheadrightarrow"
        "\\Ga": "\\mathbb{G}_a"
        "\\R": "\\mathbb{R}"
        "\\Q": "\\mathbb{Q}"
        "\\Z": "\\mathbb{Z}"
        "\\C": "\\mathbb{C}"
        "\\Kl": "\\operatorname{Kl}"
        "\\into": "\\hookrightarrow"
        "\\Gm": "\\mathbb{G}_m"
        "\\tild": "\\sim"
        "\\isom": "\\simeq"
        "\\tensor": "\\otimes"
        "\\contain": "\\supset"
        "\\adele": "\\mathbb{A}"
        "\\autom": "\\mathcal{A}"
        "\\bijection": "\\leftrightarrow"
        "\\Sp": "\\operatorname{Sp}"
        "\\SO": "\\operatorname{SO}"
        "\\PGL": "\\operatorname{PGL}"
        "\\GL": "\\operatorname{GL}"
        "\\SL": "\\operatorname{SL}"
        "\\GSp": "\\operatorname{GSp}"
        "\\tr": "\\operatorname{tr}"
        "\\diag": "\\operatorname{diag}"
        # \check is a built-in KaTeX accent (produces ǎ); your original used
        # \renewcommand to overwrite it globally with \vee. Kept out here as
        # \veecheck instead, so the accent still works if you ever need one —
        # see the note below on why.
        "\\veecheck": "\\vee"
    order: 80
  - source: "@quartz-community/citations"
    enabled: false
    order: 85
  # Off: the scaffold's notes are hard-wrapped in the source, and this plugin
  # turns every source newline into a <br>, breaking paragraphs mid-sentence.
  - source: "@quartz-community/hard-line-breaks"
    enabled: false
    order: 90
  - source: "@quartz-community/ox-hugo"
    enabled: false
    order: 91
  - source: "@quartz-community/roam"
    enabled: false
    order: 92
  - source: "@quartz-community/quartz-fonts"
    enabled: true
  - source: "@quartz-themes/core"
    enabled: true
    options:
      theme: default
      mode: both
  - source: "@quartz-community/remove-draft"
    enabled: true
  - source: "@quartz-community/explicit-publish"
    enabled: false
  - source: "@quartz-community/unlisted-pages"
    enabled: true
    options: {}
    order: 45
  - source: "@quartz-community/encrypted-pages"
    enabled: true
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
  - source: "@quartz-community/stacked-pages"
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
  - source: "@quartz-community/alias-redirects"
    enabled: true
  - source: "@quartz-community/content-index"
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: "@quartz-community/favicon"
    enabled: true
  - source: "@quartz-community/og-image"
    enabled: true
  - source: "@quartz-community/cname"
    enabled: true
  - source: "@quartz-community/canvas-page"
    enabled: true
  - source: "@quartz-community/content-page"
    enabled: true
  - source: "@quartz-community/folder-page"
    enabled: true
  - source: "@quartz-community/tag-page"
    enabled: true
  - source: "@quartz-community/explorer"
    enabled: true
    layout:
      position: left
      priority: 50
  - source: "@quartz-community/graph"
    enabled: true
    layout:
      position: right
      priority: 10
  - source: "@quartz-community/search"
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: "@quartz-community/backlinks"
    enabled: true
    layout:
      position: right
      priority: 50
  - source: "@quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: "@quartz-community/content-meta"
    enabled: true
    layout:
      position: beforeBody
      priority: 20
  - source: "@quartz-community/tag-list"
    enabled: false
    layout:
      position: beforeBody
      priority: 30
  - source: "@quartz-community/page-title"
    enabled: true
    layout:
      position: left
      priority: 10
  - source: "@quartz-community/darkmode"
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: "@quartz-community/reader-mode"
    enabled: true
    layout:
      position: left
      priority: 35
      group: toolbar
  - source: "@quartz-community/breadcrumbs"
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: "@quartz-community/comments"
    enabled: false
    options:
      provider: giscus
      options: {}
    layout:
      position: afterBody
      priority: 10
  - source: "@quartz-community/footer"
    enabled: true
    options:
      links:
        GitHub: https://github.com/jackyzha0/quartz
        Discord Community: https://discord.gg/cRFFHYye7t
    layout:
      position: footer
      priority: 50
  - source: "@quartz-community/recent-notes"
    enabled: false
  - source: "@quartz-community/spacer"
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: "@quartz-community/bases-page"
    enabled: true
    options: {}
    order: 50
  - source: "@quartz-community/note-properties"
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: false
      delimiters: ---
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
  # Off: this package isn't installed (it warned on every build), and
  # ignorePatterns above already excludes **/*.excalidraw.md, so it had nothing
  # to act on. To use Excalidraw drawings: drop that ignore pattern, run
  # `npx quartz plugin add github:quartz-community/obsidian-plugin-excalidraw`,
  # and flip this back to true.
  - source: "@quartz-community/obsidian-plugin-excalidraw"
    enabled: false
    options:
      enableInteraction: true
      darkMode: auto
      exportPadding: 20
    order: 50
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      exclude:
        - reader-mode
      positions:
        right: []
    tag:
      exclude:
        - reader-mode
      positions:
        right: []
    canvas: {}
    bases: {}
